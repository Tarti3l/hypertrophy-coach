<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    a { color: #87D0A4; } a:hover { color: #A9E0C0; }
    .dsp { font-family: Manrope, "Avenir Next", system-ui, sans-serif; }
    .eyebrow { color: #B7C3B9; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .chip { height: 36px; border-radius: 18px; border: 1px solid #344238; display: flex; align-items: center; padding: 0 14px; color: #B7C3B9; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .chip-on { background: #1F3929; border-color: #87D0A4; color: #87D0A4; }
    .cell { color: #EFF5F0; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #101511; display: flex; flex-direction: column; overflow: hidden; padding: 56px 0 34px;">

  <div style="padding: 0 24px; min-height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 8px;">
    <span style="color: #87D0A4; font-size: 16px; font-weight: 600;">Volver</span>
    <div style="display: flex; align-items: center; gap: 7px; background: #182019; border: 1px solid #344238; border-radius: 999px; padding: 6px 12px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#87D0A4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
      <span style="color: #EFF5F0; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums;">12:48</span>
    </div>
  </div>

  <div style="padding: 20px 24px 0; display: flex; flex-direction: column; gap: 6px;">
    <div class="eyebrow">Ejercicio 1 de 3</div>
    <div class="dsp" style="color: #EFF5F0; font-size: 27px; font-weight: 800; letter-spacing: -0.7px; line-height: 31px;">Press de banca con mancuernas</div>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 24px 0; overflow-x: auto;">
    <div class="chip chip-on">Peso libre</div>
    <div class="chip">Máquina</div>
    <div class="chip">Peso corporal</div>
  </div>

  <div style="padding: 12px 24px 0;">
    <div style="height: 120px; border-radius: 16px; background: #182019; border: 1px solid #344238; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
      <div style="width: 48px; height: 48px; border-radius: 24px; background: #1F3929; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#87D0A4" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 7.8v8.4L17 12 9.5 7.8Z"/></svg>
      </div>
      <div style="color: #B7C3B9; font-size: 13px;">Demo de técnica · 15 seg</div>
    </div>
  </div>

  <div style="padding: 14px 24px 0;">
    <div style="color: #EFF5F0; font-size: 15px; line-height: 22px; text-wrap: pretty;">Baja con control y empuja sin perder el apoyo de los pies.</div>
  </div>

  <div style="padding: 20px 24px 0; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;">
    <div class="dsp" style="color: #EFF5F0; font-size: 19px; font-weight: 700; letter-spacing: -0.2px;">Tus series</div>
    <div style="color: #B7C3B9; font-size: 13px;">Anterior: 20 kg × 10</div>
  </div>

  <div style="padding: 12px 24px 0;">
    <div style="display: grid; grid-template-columns: 34px 1fr 1fr 58px; gap: 8px; align-items: center; padding: 0 8px 8px;">
      <div class="eyebrow">Nº</div>
      <div class="eyebrow">Peso</div>
      <div class="eyebrow">Reps</div>
      <div></div>
    </div>

    <div style="display: grid; grid-template-columns: 34px 1fr 1fr 58px; gap: 8px; align-items: center; height: 56px; background: #1F3929; border-radius: 12px; padding: 0 8px; margin-bottom: 8px;">
      <span class="dsp" style="color: #87D0A4; font-size: 17px; font-weight: 800;">1</span>
      <span class="cell">22.5 kg</span>
      <span class="cell">10</span>
      <div style="height: 38px; border-radius: 10px; background: #87D0A4; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101511" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7.5"/></svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 34px 1fr 1fr 58px; gap: 8px; align-items: center; height: 56px; background: #1F3929; border-radius: 12px; padding: 0 8px; margin-bottom: 8px;">
      <span class="dsp" style="color: #87D0A4; font-size: 17px; font-weight: 800;">2</span>
      <span class="cell">22.5 kg</span>
      <span class="cell">9</span>
      <div style="height: 38px; border-radius: 10px; background: #87D0A4; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#101511" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7.5"/></svg>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 34px 1fr 1fr 58px; gap: 8px; align-items: center; height: 56px; border: 1px solid #344238; border-radius: 12px; padding: 0 8px;">
      <span class="dsp" style="color: #EFF5F0; font-size: 17px; font-weight: 800;">3</span>
      <span style="color: #B7C3B9; font-size: 17px;">— kg</span>
      <span style="color: #B7C3B9; font-size: 17px;">—</span>
      <div style="height: 38px; border-radius: 10px; border: 1px solid #344238; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B7C3B9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5 10 17.5 19 7.5"/></svg>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 24px;">
    <div style="height: 52px; border-radius: 14px; background: #87D0A4; display: flex; align-items: center; justify-content: center;">
      <span style="color: #101511; font-size: 16px; font-weight: 700;">Finalizar entrenamiento · 2 series</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
